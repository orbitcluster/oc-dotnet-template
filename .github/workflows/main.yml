---
name: app-ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  actions: read
  contents: write
  issues: write
  pull-requests: write
  id-token: write
  packages: write

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: orbitcluster/oc-cicd-dotnet-workflow@feat/intialize_workflow
        with:
          dotnet-version: "8.0.x"
          solution-path: "src/webApp"
          test-project-path: "test"

